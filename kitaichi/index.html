<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>懸賞 期待値シミュレーター｜その懸賞、時給いくら？</title>
<meta name="description" content="懸賞の当選確率と期待値をシビアに計算。時給換算で「やる価値ある？」を毒舌判定します。">
<style>
  :root{ --bg:#0f1115; --card:#1a1d24; --text:#f2f3f5; --sub:#9aa3af; --accent:#ffb020; --danger:#ff5470; --ok:#3ddc84; --border:#2a2e37; }
  @media (prefers-color-scheme: light){ :root{ --bg:#f6f6f8; --card:#ffffff; --text:#17181c; --sub:#5b6470; --border:#e2e4e9; } }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); }
  .wrap{ max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1{ font-size:22px; margin:8px 0 4px; }
  .lead{ color:var(--sub); font-size:13px; margin:0 0 18px; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  label{ display:block; font-size:13px; color:var(--sub); margin:12px 0 6px; }
  label:first-child{ margin-top:0; }
  input{ width:100%; padding:12px; font-size:17px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  button.calc{ width:100%; margin-top:18px; padding:14px; font-size:17px; font-weight:700; border:none; border-radius:12px; background:var(--accent); color:#1a1405; cursor:pointer; }
  .rank{ font-size:44px; font-weight:900; line-height:1; }
  .rank.S{ color:var(--ok); } .rank.A{ color:#7ee787; } .rank.B{ color:var(--accent); }
  .rank.C{ color:#ffa657; } .rank.D{ color:#ff8a7a; } .rank.E{ color:var(--danger); }
  .big{ font-size:26px; font-weight:800; margin:6px 0; }
  .row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--border); font-size:15px; }
  .row:last-child{ border-bottom:none; }
  .row b{ font-variant-numeric:tabular-nums; }
  .snark{ margin-top:12px; font-size:15px; line-height:1.7; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px; }
  .share{ display:inline-block; margin-top:14px; padding:11px 18px; border-radius:999px; background:#000; color:#fff; text-decoration:none; font-weight:700; font-size:14px; border:1px solid var(--border); }
  @media (prefers-color-scheme: light){ .share{ background:#000; } }
  .adslot{ text-align:center; color:var(--sub); font-size:12px; border:1px dashed var(--border); border-radius:10px; padding:14px; }
  .note{ color:var(--sub); font-size:11px; line-height:1.7; margin-top:16px; }
  #result{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 懸賞 期待値シミュレーター</h1>
  <p class="lead">その懸賞、時給換算でいくら？ 当選確率と期待値をシビアに計算して、毒舌で判定します。</p>

  <div class="card">
    <label>賞品の価値（円）</label>
    <input id="prize" type="number" inputmode="numeric" value="10000" min="0">
    <label>当選人数（名）</label>
    <input id="winners" type="number" inputmode="numeric" value="100" min="1">
    <label>応募総数の予想（人）</label>
    <input id="applicants" type="number" inputmode="numeric" value="50000" min="1">
    <label>自分の応募口数（口）</label>
    <input id="entries" type="number" inputmode="numeric" value="1" min="1">
    <label>応募にかかる時間（分）</label>
    <input id="minutes" type="number" inputmode="decimal" value="3" min="0.1" step="0.1">
    <button class="calc" onclick="calc()">判定する</button>
  </div>

  <div class="card" id="result">
    <div style="display:flex; align-items:center; gap:14px;">
      <div class="rank" id="rank">-</div>
      <div>
        <div style="font-size:12px; color:var(--sub);">時給換算</div>
        <div class="big" id="hourly">-</div>
      </div>
    </div>
    <div style="margin-top:10px;">
      <div class="row"><span>当選確率（自分の分）</span><b id="prob">-</b></div>
      <div class="row"><span>期待値</span><b id="ev">-</b></div>
      <div class="row"><span>当たるまでの期待応募回数</span><b id="trials">-</b></div>
    </div>
    <div class="snark" id="snark"></div>
    <a class="share" id="share" href="#" target="_blank" rel="noopener">𝕏 で結果をシェア</a>
  </div>

  <div class="adslot">広告枠（準備中）</div>

  <p class="note">※ 当選確率は「当選人数 ÷ 応募総数」を1口あたりの確率とし、複数口は独立試行として近似計算しています。実際のキャンペーン条件とは異なる場合があります。期待値は期待値であって、当選を保証するものではありません。</p>
</div>

<script>
const SNARK = {
  S: ["神懸賞。応募しない理由がない。", "時給換算でバイト超え。もはや労働。", "この確率で外したら、逆に才能。"],
  A: ["普通にアリ。バイトと同等の時給効率。", "堅実に取りにいく価値あり。", "この調子で数を打てば、そのうち当たる。"],
  B: ["悪くない。暇つぶし以上、労働未満。", "やる価値はある。ただし過信は禁物。", "期待値的にはプラス寄り。淡々と応募すべし。"],
  C: ["趣味の範囲。夢を買う値段としては妥当。", "時給換算は微妙だが、当たればデカい。", "効率厨には怒られるライン。楽しければOK。"],
  D: ["ほぼ慈善事業。運営を応援する気持ちでどうぞ。", "その時間でバイトした方がマシ説、浮上。", "当たる確率は、推しが自分に気づく確率と互角。"],
  E: ["爆死。宝くじより夢がない。", "応募する時間が一番もったいない。寝よう。", "この確率、当てる前に寿命が来る。", "運営の養分、お疲れ様です。"]
};
function fmt(n){ return n.toLocaleString('ja-JP'); }
function calc(){
  const prize = Math.max(0, +document.getElementById('prize').value || 0);
  const winners = Math.max(1, +document.getElementById('winners').value || 1);
  const applicants = Math.max(1, +document.getElementById('applicants').value || 1);
  const entries = Math.max(1, +document.getElementById('entries').value || 1);
  const minutes = Math.max(0.1, +document.getElementById('minutes').value || 0.1);
  const p1 = Math.min(1, winners / applicants);
  const pMine = 1 - Math.pow(1 - p1, entries);
  const ev = prize * pMine;
  const hourly = ev / (minutes / 60);
  let rank;
  if (hourly >= 3000) rank = 'S'; else if (hourly >= 1500) rank = 'A';
  else if (hourly >= 1000) rank = 'B'; else if (hourly >= 500) rank = 'C';
  else if (hourly >= 100) rank = 'D'; else rank = 'E';
  const lines = SNARK[rank];
  const snark = lines[Math.floor(Math.random() * lines.length)];
  const probText = pMine >= 0.01 ? (pMine * 100).toFixed(2) + '%' : (pMine * 100).toFixed(4) + '%';
  const trials = pMine > 0 ? Math.round(1 / pMine) : Infinity;
  document.getElementById('rank').textContent = rank;
  document.getElementById('rank').className = 'rank ' + rank;
  document.getElementById('hourly').textContent = '¥' + fmt(Math.round(hourly)) + ' /時';
  document.getElementById('prob').textContent = probText;
  document.getElementById('ev').textContent = '¥' + (ev >= 100 ? fmt(Math.round(ev)) : ev.toFixed(2));
  document.getElementById('trials').textContent = isFinite(trials) ? '約' + fmt(trials) + '回' : '—';
  document.getElementById('snark').textContent = snark;
  const text = '【懸賞期待値診断】時給換算 ¥' + fmt(Math.round(hourly)) + '（' + rank + 'ランク）当選確率 ' + probText + '｜' + snark + ' #懸賞期待値診断';
  document.getElementById('share').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(location.href);
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
</script>
</body>
</html>
